<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a2a52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ほしぞら絵本">
<title>ほしぞら絵本</title>
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<!-- ===== ほんだな ===== -->
<section id="shelf" class="view on">
  <header class="shelf-head">
    <div class="title">
      <span class="rule"></span>
      <svg class="mark" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 0c1 7.2 4.8 11 12 12-7.2 1-11 4.8-12 12-1-7.2-4.8-11-12-12C7.2 11 11 7.2 12 0z"/>
      </svg>
      <h1>ほしぞら絵本</h1>
      <svg class="mark" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 0c1 7.2 4.8 11 12 12-7.2 1-11 4.8-12 12-1-7.2-4.8-11-12-12C7.2 11 11 7.2 12 0z"/>
      </svg>
      <span class="rule r"></span>
    </div>
  </header>

  <div class="sky" id="sky" role="img" aria-label="ふたりの よぞら">
    <div class="stars"></div>
    <div class="sky-label">ふたりの よぞら</div>
  </div>

  <div class="rail" id="rail" aria-label="えほんの いちらん"></div>

  <div class="dots" id="shelfDots" aria-hidden="true"></div>
  <p class="hint">よこに すべらせて えらぶ</p>

  <button class="tiny" id="grownOpen">おとなのひと</button>
</section>

<!-- ===== よむ がめん ===== -->
<section id="reader" class="view" hidden>
  <div class="spread" id="spread">
    <div class="pic"><img id="pic" alt=""></div>
    <div class="text" id="text"></div>
  </div>

  <button class="tap tap-prev" id="tapPrev" aria-label="まえの ページ"></button>
  <button class="tap tap-next" id="tapNext" aria-label="つぎの ページ"></button>

  <div class="bar">
    <button class="back" id="back">◀ ほんだな</button>
    <div class="dots" id="pageDots" aria-hidden="true"></div>
    <div class="done" id="done" hidden></div>
  </div>

  <div class="toast" id="toast" hidden aria-live="polite"></div>
</section>

<div class="loading" id="loading" hidden>ひらいています…</div>

<!-- ===== おとなのひと（合言葉で そろえる・星を けす） ===== -->
<dialog class="grown" id="grown">
  <h2>おとなのひと</h2>
  <section>
    <h3>ほかの端末と 星を そろえる</h3>
    <p class="note">同じ合言葉を入れた iPad・iPhone で、読んだ星が そろいます。送るのは 星の色・本・押した時刻だけです。</p>
    <input id="syncKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="合言葉（12文字以上）">
    <div class="row">
      <button type="button" id="syncSave">そろえる</button>
      <button type="button" id="syncOff" class="sub">やめる</button>
    </div>
    <p class="status" id="syncStatus" aria-live="polite"></p>
  </section>
  <section id="restoreBox" hidden>
    <h3>まえの日に もどす</h3>
    <div class="row"><select id="restoreDay"></select><button type="button" id="restoreGo" class="sub">もどす</button></div>
  </section>
  <section>
    <button type="button" id="resetStamps" class="danger">星を ぜんぶ けす</button>
  </section>
  <button type="button" id="grownClose" class="close">とじる</button>
</dialog>

<script src="assets/stars.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
